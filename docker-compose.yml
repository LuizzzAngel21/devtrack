# Orquestación de los 3 contenedores

services:

  #  Contenedor 1: Proxy inverso 
  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"          # único puerto expuesto al exterior
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - app-network
    restart: unless-stopped

  #  Contenedor 2: Aplicación Node.js 
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    image: ${DOCKER_USERNAME}/devtrack:1.0.0
    expose:
      - "3000"           # solo visible dentro de la red interna
    environment:
      DB_HOST:        db
      DB_PORT:        5432
      DB_NAME:        ${POSTGRES_DB}
      DB_USER:        ${POSTGRES_USER}
      DB_PASSWORD:    ${POSTGRES_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET}
      PORT:           3000
    depends_on:
      db:
        condition: service_healthy   # espera a que PostgreSQL esté listo
    networks:
      - app-network
    restart: unless-stopped

  #  Contenedor 3: Base de datos 
  db:
    image: postgres:16-alpine     
    expose:
      - "5432"           # sin 'ports': no accesible desde internet
    environment:
      POSTGRES_DB:       ${POSTGRES_DB}
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg-data:/var/lib/postgresql/data        # persistencia
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app-network
    restart: unless-stopped

#  Red interna 
networks:
  app-network:
    driver: bridge

#  Volumen persistente 
volumes:
  pg-data: