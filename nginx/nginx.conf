# Nginx es el único contenedor expuesto al exterior (puerto 80)
# La app Node.js solo es accesible desde la red interna de Docker

server {
    listen 80;
    server_name _;

    # Tamaño máximo de los datos enviados en el formulario
    client_max_body_size 1m;

    location / {
        # Reenvía todas las peticiones al contenedor de la app
        proxy_pass         http://app:3000;

        # Cabeceras necesarias para que Express reciba
        # la IP real del cliente y el protocolo correcto
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Timeouts razonables
        proxy_connect_timeout 10s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }
}